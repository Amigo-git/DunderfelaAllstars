<!doctype html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f1eee3">
<meta name="description" content="Dunderfela Allstars. Gard på fele, Igor på gitar og Tøsse på trekkspill.">
<title>Dunderfela Allstars</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23f1eee3'/%3E%3Cpath d='M18 10L16 53M19 11C54 7 57 51 18 53' fill='none' stroke='%2338322d' stroke-width='4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="artwork.css">
<script src="app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#youtube-link">Hopp til lenkene</a>
<main class="artwork">
  <picture>
    <source media="(min-width: 700px)" srcset="assets/homepage-wide.png">
    <img class="homepage-image" src="assets/homepage.png" width="941" height="1672" alt="Håndtegnet Dunderfela Allstars hjemmeside" fetchpriority="high">
  </picture>
  <img class="original-logo" src="assets/logo-transparent.png" alt="Dunderfela Allstars-logo">
  <div class="sr-only"><h1>Dunderfela Allstars</h1><h2>Bandet</h2><p>Gard — fele. Igor — gitar. Tøsse — trekkspill.</p><h2>Kontakt</h2></div>
  <nav aria-label="Klikk: sosiale medier, galleri, press kit og live show">
    <button id="youtube-link" class="hotspot" style="--x:12;--y:66;--w:23;--h:10.5" data-destination="youtube" aria-label="YouTube"><span class="hover-window" aria-hidden="true"></span></button>
    <button id="facebook-link" class="hotspot" style="--x:40;--y:66;--w:22;--h:10.5" data-destination="facebook" aria-label="Facebook"><span class="hover-window" aria-hidden="true"></span></button>
    <button id="instagram-link" class="hotspot" style="--x:69;--y:66;--w:22;--h:10.5" data-destination="instagram" aria-label="Instagram"><span class="hover-window" aria-hidden="true"></span></button>
    <button id="gallery-link" class="hotspot" style="--x:12;--y:78.5;--w:24;--h:11" data-dialog="gallery-dialog" aria-label="Galleri"><span class="hover-window" aria-hidden="true"></span></button>
    <button id="press-link" class="hotspot" style="--x:41;--y:78.5;--w:21;--h:11" data-destination="pressKit" data-fallback-dialog="press-dialog" aria-label="Press kit"><span class="hover-window" aria-hidden="true"></span></button>
    <button id="live-link" class="hotspot" style="--x:70;--y:78.5;--w:21;--h:11" data-destination="liveShows" data-fallback-dialog="live-dialog" aria-label="Live show"><span class="hover-window" aria-hidden="true"></span></button>
  </nav>
</main>
  <dialog id="gallery-dialog" aria-labelledby="gallery-title"><div class="dialog-heading"><h2 id="gallery-title">galleri</h2><button class="close-dialog" aria-label="Lukk galleri">×</button></div><div class="photo-grid">
    <a href="assets/DSC05807.jpg" target="_blank" rel="noopener"><img src="assets/DSC05807.jpg" alt="Dunderfela Allstars — bandfoto 1" loading="lazy"></a>
    <a href="assets/DSC05814.jpg" target="_blank" rel="noopener"><img src="assets/DSC05814.jpg" alt="Dunderfela Allstars — bandfoto 2" loading="lazy"></a>
    <a href="assets/DSC05860.jpg" target="_blank" rel="noopener"><img src="assets/DSC05860.jpg" alt="Dunderfela Allstars — bandfoto 3" loading="lazy"></a>
    <a href="assets/DSC05919.jpg" target="_blank" rel="noopener"><img src="assets/DSC05919.jpg" alt="Dunderfela Allstars — bandfoto 4" loading="lazy"></a>
    <a href="assets/DSC05924.jpg" target="_blank" rel="noopener"><img src="assets/DSC05924.jpg" alt="Dunderfela Allstars — bandfoto 5" loading="lazy"></a>
    <a href="assets/DSC05952.jpg" target="_blank" rel="noopener"><img src="assets/DSC05952.jpg" alt="Dunderfela Allstars — bandfoto 6" loading="lazy"></a>
    <a href="assets/DSC05997.jpg" target="_blank" rel="noopener"><img src="assets/DSC05997.jpg" alt="Dunderfela Allstars — bandfoto 7" loading="lazy"></a>
  </div></dialog>
  <dialog id="press-dialog" class="small-dialog" aria-labelledby="press-title"><div class="dialog-heading"><h2 id="press-title">press kit</h2><button class="close-dialog" aria-label="Lukk press kit">×</button></div><p>Ta kontakt for pressebilder og info om bandet.</p><a class="ink-link" href="mailto:dunderov@gmail.com?subject=Press%20kit%20%E2%80%94%20Dunderfela%20Allstars">dunderov@gmail.com</a></dialog>
  <dialog id="live-dialog" class="small-dialog" aria-labelledby="live-title"><div class="dialog-heading"><h2 id="live-title">live show</h2><button class="close-dialog" aria-label="Lukk live show">×</button></div><p>Nye konsertdatoer kommer her.</p><p>Vil du booke oss?</p><a class="ink-link" href="mailto:dunderov@gmail.com?subject=Booking%20%E2%80%94%20Dunderfela%20Allstars">dunderov@gmail.com</a></dialog>
  <p class="notice" role="status" aria-live="polite"></p>
</body>
</html>
